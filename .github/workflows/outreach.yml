name: Outreach Automation

"on":
  schedule:
    - cron: "13 0 * * *"
    - cron: "37 2 * * *"
    - cron: "1 5 * * *"
    - cron: "25 7 * * *"
    - cron: "49 9 * * *"
    - cron: "13 12 * * *"
    - cron: "37 14 * * *"
    - cron: "1 17 * * *"
    - cron: "25 19 * * *"
    - cron: "49 21 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run in dry-run mode (no emails sent, no CSV changes)"
        required: false
        type: boolean
        default: false
      test_email:
        description: "Optional: redirect this manual run to a test email address; leave blank to contact the company"
        required: false
        type: string
        default: ""

concurrency:
  group: outreach-pipeline
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  outreach:
    name: Run Outreach and Auto-Merge
    if: github.repository == 'ops551/data-pipeline-test' || github.repository == 'Nahid625/Recent-uk-Companys'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
      ENRICH_BATCH_SIZE: "50"
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      COMPANIES_HOUSE_API_KEY: ${{ secrets.COMPANIES_HOUSE_API_KEY }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      SMTP_REPLY_TO: ${{ secrets.SMTP_REPLY_TO }}
      FOLLOWUP_RESEND_API_KEY: ${{ secrets.FOLLOWUP_RESEND_API_KEY }}
      FOLLOWUP_EMAIL_FROM: ${{ secrets.FOLLOWUP_EMAIL_FROM }}
      SPAM_ALERT_EMAIL: ${{ secrets.SPAM_ALERT_EMAIL }}
      ENABLE_HTML_EMAIL: "true"
      OUTREACH_LIMIT: "1"
      OUTREACH_DRY_RUN: ${{ inputs.dry_run || 'false' }}
      TEST_EMAIL: ${{ github.event_name == 'workflow_dispatch' && inputs.test_email || '' }}
      DAYS_BACK: "10"
      QUICK_EMAIL_VERIFICATION_API_KEY: ${{ secrets.QUICK_EMAIL_VERIFICATION_API_KEY }}
      SNIFFMAIL_API_KEY: ${{ secrets.SNIFFMAIL_API_KEY }}
      REON_API_KEY: ${{ secrets.REON_API_KEY }}
      ZEROBOUNCE: ${{ secrets.ZEROBOUNCE }}
      VERIFALIA_USERNAME: ${{ secrets.VERIFALIA_USERNAME }}
      VERIFALIA_PASSWORD: ${{ secrets.VERIFALIA_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore Alerts Cache
        uses: actions/cache@v4
        with:
          path: .alerts_cache.json
          key: alerts-cache-${{ github.run_id }}
          restore-keys: |
            alerts-cache-

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Puppeteer Browsers
        run: npx puppeteer browsers install chrome

      - name: Validate SMTP credentials
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run != true
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          if [ -z "$SMTP_HOST" ] || [ -z "$SMTP_USER" ] || [ -z "$SMTP_PASS" ]; then
            echo "::error::Set SMTP_HOST, SMTP_USER, and SMTP_PASS repository secrets before running manually."
            exit 1
          fi

      - name: Run outreach
        run: npm run outreach

      - name: Check CSV changes
        id: check_changes
        run: |
          if [ -n "$(git status --porcelain *.csv)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected in CSV files."
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected in CSV files."
          fi

      - name: Commit and Push Directly
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add *.csv
          git commit -m "chore(outreach): auto-replenish and update sent leads [run ${{ github.run_id }}]"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && break || sleep 3
          done

