name: Outreach Automation

'on':
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in dry-run mode (no emails sent, no CSV changes)'
        required: false
        type: boolean
        default: false

concurrency:
  group: outreach-pipeline
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  outreach:
    name: Run Outreach and Auto-Merge
    if: github.repository == 'ops551/data-pipeline-test'
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
      ENRICH_BATCH_SIZE: '50'
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      COMPANIES_HOUSE_API_KEY: ${{ secrets.COMPANIES_HOUSE_API_KEY }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      SPAM_ALERT_EMAIL: ${{ secrets.SPAM_ALERT_EMAIL }}
      OUTREACH_LIMIT: '1'
      OUTREACH_DRY_RUN: ${{ inputs.dry_run || 'false' }}
      TEST_EMAIL: nahidhosan027@gmail.com
      DAYS_BACK: "10"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        
      - name: Install Puppeteer Browsers
        run: npx puppeteer browsers install chrome

      - name: Validate SMTP credentials
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run != true
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          if [ -z "$SMTP_HOST" ] || [ -z "$SMTP_USER" ] || [ -z "$SMTP_PASS" ]; then
            echo "::error::Set SMTP_HOST, SMTP_USER, and SMTP_PASS repository secrets before running manually."
            exit 1
          fi

      - name: Auto-Replenish Leads (if empty)
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run != true
        run: |
          LEADS_COUNT=$(node -e "const fs=require('fs'); try { const d=fs.readFileSync('leads.csv','utf8').split('\n').filter(l=>l.includes(',lead,') && l.includes('@')).length; console.log(d); } catch(e){console.log(0)}")
          echo "Current pending leads: $LEADS_COUNT"
          if [ "$LEADS_COUNT" -lt 5 ]; then
            echo "Queue is running very low! Auto-scraping new companies..."
            npm start
            echo "Enriching new companies with Puppeteer..."
            npm run enrich
          else
            echo "Sufficient leads in queue. Skipping scraping phase."
          fi

      - name: Run outreach
        run: npm run outreach

      - name: Check CSV changes
        id: check_changes
        run: |
          if [ -n "$(git status --porcelain *.csv)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected in CSV files."
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected in CSV files."
          fi

      - name: Commit and Push Directly
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add *.csv
          git commit -m "chore(outreach): auto-replenish and update sent leads [run ${{ github.run_id }}]"
          git push origin HEAD:main
